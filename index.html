<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Etch-a-Sketch</title>
    <link rel="preload" as="font" href="fonts/Roboto-Regular.woff" crossorigin>
    <link rel="preload" as="font" href="fonts/Roboto-Regular.woff2" crossorigin>
    <link rel="preload" as="font" href="fonts/Roboto-Bold.woff" crossorigin>
    <link rel="preload" as="font" href="fonts/Roboto-Bold.woff2" crossorigin>
    <link rel="stylesheet" href="fonts.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="/favicon.svg">
    <script src="main.js" defer></script>
</head>

<body>
    <div class="etch-a-sketch-container">
        <div class="tools">
            <div class="input-holder">
                <label for="numberOfGridsInput" id="numberOfGridsLabel">2</label>
                <input type="range" min="2" max="100" value="2" id="numberOfGridsInput">
            </div>
            <div class="modes">
                <label for="colorInput">Color: 
                    <input type="color" class="mode" id="colorInput">
                </label>
                <button class="mode rainbow">Rainbow</button>
                <button class="mode eraser">Eraser</button>
            </div>
        </div>
        <div class="container">
        </div>
    </div>
</body>

</html>
